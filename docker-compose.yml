services:
  postgres:
    image: postgres:17-alpine
    container_name: notas-postgres
    environment:
      POSTGRES_DB: notas
      POSTGRES_USER: notas
      POSTGRES_PASSWORD: notas
    ports:
      - "5434:5432"
    volumes:
      - notas-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notas -d notas"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  notas-data:
