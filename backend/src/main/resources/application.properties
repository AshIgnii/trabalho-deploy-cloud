spring.application.name=backend
server.port=8085
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/notas}
spring.datasource.username=${DB_USERNAME:notas}
spring.datasource.password=${DB_PASSWORD:notas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
